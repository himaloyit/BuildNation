spring.application.name=build-nation-ui
server.port=8090

# Vaadin
vaadin.launch-browser=false

# API Gateway — the UI never calls individual microservices directly, only through this.
gateway.base-url=${GATEWAY_URL:http://localhost:8081}

# Disable Kafka for local dev (this module has no Kafka dependency, kept for parity with other services if added later)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Service Discovery — set via SPRING_PROFILES_ACTIVE env var
# eureka -> UAT/Docker (Netflix Eureka)  |  k8s -> Production (Kubernetes-native)
spring.profiles.active=eureka

# Eureka client — set explicitly (not via env var): eureka.client.service-url is a
# Map<String,String>, and EUREKA_CLIENT_SERVICEURL_DEFAULTZONE relaxed-binds the map
# key as lowercase "defaultzone", which the client looks up as case-sensitive
# "defaultZone" and misses, silently falling back to localhost.
eureka.client.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://buildnation-eureka:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# Distributed Tracing (Zipkin) — override ZIPKIN_URL for Docker: http://zipkin:9411
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://zipkin:9411}/api/v2/spans

# Logging
logging.file.name=logs/build-nation-ui/app.log
